    <!-- Side Cyber Graphics -->

<div class="side-cyber left-cyber">

<div class="cyber-orb">

    <!-- Animated Cyber Background -->

        <div class="binary binary3">11 00 10 01 10 11</div>

    <!-- Main CyberSafe Card -->

        <!-- Shield -->

        <div class="security-logo">

        <h1>Cyber Safe</h1>

        <!-- Menu -->

        <div class="menu">

            <a href="message.html">
                <button>
                    <span class="button-icon">🔍</span>
                    <span>Check Message</span>
                    <span class="arrow">›</span>
                </button>
            </a>


            <a href="email.html">
                <button>

            </a>

            <a href="twofa-info.html">
    <button>
        <span class="button-icon">🔐</span>
        <span>2FA - Two-Factor Authentication</span>
        <span class="arrow">›</span>
    </button>
</a>

    <div class="twofa-setting">

    <div class="twofa-setting-text">

        <strong>🔐 2FA - Two-Factor Authentication</strong>

        <small>
            Require a verification code when logging in
        </small>

    </div>

    <label class="switch">

        <input
            type="checkbox"
            id="twoFASetting"
            onchange="toggleTwoFA()"
        >

        <span class="slider"></span>

    </label>

</div>


            <a href="tips.html">
                <button>
                    <span class="button-icon">💡</span>
                    <span>Cyber Tips</span>
                    <span class="arrow">›</span>

                <button>

            </a>


            <a href="about.html">
                <button>
                    <span class="button-icon">ℹ️</span>
                    <span>About App</span>
                    <span class="arrow">›</span>
                </button>
            </a>

        </div>


        <!-- Safety Message -->

        <div class="safety-message">

            <div class="mini-shield">
                🛡️
            </div>

            <h2>Your Digital Safety Starts Here</h2>

            <p>
                Learn <span>•</span> Check <span>•</span> Protect
            </p>

        </div>

    </div>

    <script>

    if(sessionStorage.getItem("cyberSafeLogin") !== "true"){

        window.location.href = "login.html";

    }

    function toggleTwoFA(){

    let toggle = document.getElementById("twoFASetting");

    localStorage.setItem(
        "twoFAEnabled",
        toggle.checked ? "true" : "false"
    );

}

window.addEventListener("load", function(){

    let toggle = document.getElementById("twoFASetting");

    if(toggle){

        toggle.checked =
            localStorage.getItem("twoFAEnabled") === "true";

    }

});

</script>

    <script src="script.js"></script>
