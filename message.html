<body>

<div class="loader"></div>

<h3>🔍 Analyzing your message...</h3>

<p>Please wait...</p>

</div>

    <div id="result">

<h2>Result</h2>

<p>Waiting for analysis...</p>

</div>

    <br>

        <button>⬅ Back to Home</button>
    </a>
    </div>
