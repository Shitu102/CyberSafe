<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scam Awareness</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container guide-container">

    <h1>🚨 Scam Awareness</h1>

    <p class="subtitle">
        Select a scam type to learn how to stay safe.
    </p>


    <!-- Fake Call -->

    <div class="guide-item">

        <button class="guide-btn"
                onclick="showScam('callScam')">

            📞 Fake Call Scam
            <span>›</span>

        </button>

        <div id="callScam" class="guide-info"></div>

    </div>


    <!-- Fake SMS -->

    <div class="guide-item">

        <button class="guide-btn"
                onclick="showScam('smsScam')">

            💬 Fake SMS Scam
            <span>›</span>

        </button>

        <div id="smsScam" class="guide-info"></div>

    </div>


    <!-- Phishing Email -->

    <div class="guide-item">

        <button class="guide-btn"
                onclick="showScam('phishingScam')">

            📧 Phishing Email
            <span>›</span>

        </button>

        <div id="phishingScam" class="guide-info"></div>

    </div>


    <!-- UPI -->

    <div class="guide-item">

        <button class="guide-btn"
                onclick="showScam('upiScam')">

            💳 UPI Scam
            <span>›</span>

        </button>

        <div id="upiScam" class="guide-info"></div>

    </div>


    <!-- Job -->

    <div class="guide-item">

        <button class="guide-btn"
                onclick="showScam('jobScam')">

            💼 Job Scam
            <span>›</span>

        </button>

        <div id="jobScam" class="guide-info"></div>

    </div>


    <!-- Lottery -->

    <div class="guide-item">

        <button class="guide-btn"
                onclick="showScam('lotteryScam')">

            🎁 Lottery Scam
            <span>›</span>

        </button>

        <div id="lotteryScam" class="guide-info"></div>

    </div>


    <br>

    <a href="index.html">

        <button class="back-home">
            ← Back to Home
        </button>

    </a>

</div>


<script>

function showScam(topic){

    /* Close all other information */

    document.querySelectorAll(".guide-info").forEach(function(box){

        box.innerHTML = "";

        box.style.display = "none";

    });


    let scam = document.getElementById(topic);

    scam.style.display = "block";


    if(topic === "callScam"){

        scam.innerHTML = `
            <h2>📞 Fake Call Scam</h2>

            <ul>
                <li>Scammers may pretend to be bank or government officials.</li>
                <li>They may ask for OTP, PIN or other sensitive information.</li>
                <li>Never share OTP, PIN or passwords over a call.</li>
                <li>End the call and contact the organisation using its official number.</li>
            </ul>
        `;

    }


    else if(topic === "smsScam"){

        scam.innerHTML = `
            <h2>💬 Fake SMS Scam</h2>

            <ul>
                <li>Be careful with unexpected SMS messages.</li>
                <li>Don't click suspicious links.</li>
                <li>Don't share OTP or personal information.</li>
                <li>Verify the message using the official website or app.</li>
            </ul>
        `;

    }


    else if(topic === "phishingScam"){

        scam.innerHTML = `
            <h2>📧 Phishing Email</h2>

            <ul>
                <li>Check the sender's email address carefully.</li>
                <li>Be careful with urgent requests.</li>
                <li>Don't open suspicious attachments.</li>
                <li>Don't enter passwords on unknown websites.</li>
            </ul>
        `;

    }


    else if(topic === "upiScam"){

        scam.innerHTML = `
            <h2>💳 UPI Scam</h2>

            <ul>
                <li>Never share your UPI PIN.</li>
                <li>Remember: receiving money does not require entering your UPI PIN.</li>
                <li>Check the receiver's details before making a payment.</li>
                <li>Don't scan unknown QR codes.</li>
            </ul>
        `;

    }


    else if(topic === "jobScam"){

        scam.innerHTML = `
            <h2>💼 Job Scam</h2>

            <ul>
                <li>Be careful with jobs promising unusually high earnings.</li>
                <li>Don't pay unknown people for a job offer.</li>
                <li>Verify the company and job details.</li>
                <li>Don't share sensitive documents with unverified recruiters.</li>
            </ul>
        `;

    }


    else if(topic === "lotteryScam"){

        scam.innerHTML = `
            <h2>🎁 Lottery Scam</h2>

            <ul>
                <li>Be careful if you are told that you won a prize you never entered for.</li>
                <li>Never pay a fee to claim an unexpected prize.</li>
                <li>Don't share bank details or OTP.</li>
                <li>Verify the offer through an official source.</li>
            </ul>
        `;

    }

}

</script>


</body>

</html>
