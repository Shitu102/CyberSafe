<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Two-Factor Authentication</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🔐 Two-Factor Authentication</h1>

    <p>For your security, verify your identity before continuing.</p>

    <div class="helpCard twofa-card">

        <h2>🛡️ Verification Required</h2>

        <p>
            Enter the 6-digit verification code to continue to CyberSafe.
        </p>

        <div class="otp-container">

            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-box" maxlength="1" inputmode="numeric">

        </div>

        <br>

        <div class="otp-timer">
    ⏱️ Code expires in <span id="timer">30</span>s
</div>

<button onclick="verifyOTP()">
    🔓 Verify & Continue
</button>

<button id="resendBtn" class="resend-btn" onclick="resendOTP()" disabled>
    🔄 Resend Code
</button>

        <p id="otpResult"></p>

    </div>

</div>

<script>

function verifyOTP(){

    let boxes = document.querySelectorAll(".otp-box");

    let otp = "";

    boxes.forEach(function(box){
        otp += box.value;
    });

    let result = document.getElementById("otpResult");

    if(otp === "123456"){

        result.innerHTML = "✅ Verification successful!";
        result.style.color = "green";

        setTimeout(function(){

            window.location.href = "index.html";

        },1000);

    }
    else{

        result.innerHTML =
            "❌ Invalid verification code. Please try again.";

        result.style.color = "red";

    }

}


/* OTP Auto Next + Backspace */

const otpBoxes = document.querySelectorAll(".otp-box");

otpBoxes.forEach((box, index) => {

    box.addEventListener("input", function(){

        if(this.value.length === 1 &&
           index < otpBoxes.length - 1){

            otpBoxes[index + 1].focus();

        }

    });


    box.addEventListener("keydown", function(event){

        if(event.key === "Backspace"){

            if(this.value === "" && index > 0){

                otpBoxes[index - 1].focus();

            }

        }

    });

});

let timeLeft = 30;

let timer = document.getElementById("timer");

let resendBtn = document.getElementById("resendBtn");

let countdown = setInterval(function(){

    timeLeft--;

    timer.textContent = timeLeft;

    if(timeLeft <= 0){

        clearInterval(countdown);

        timer.textContent = "0";

        resendBtn.disabled = false;

    }

},1000);


function resendOTP(){

    timeLeft = 30;

    timer.textContent = timeLeft;

    resendBtn.disabled = true;

    const boxes = document.querySelectorAll(".otp-box");

    boxes.forEach(function(box){
        box.value = "";
    });

    boxes[0].focus();

    document.getElementById("otpResult").innerHTML =
        "🔄 New verification code generated.";

    countdown = setInterval(function(){

        timeLeft--;

        timer.textContent = timeLeft;

        if(timeLeft <= 0){

            clearInterval(countdown);

            timer.textContent = "0";

            resendBtn.disabled = false;

        }

    },1000);

}

</script>

</body>
</html>
