<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome - CyberSafe</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="security-logo">
            <div class="shield">
                <img src="Logo.jpeg" alt="CyberSafe Logo">
            </div>
        </div>

        <h1>CyberSafe</h1>

        <p class="subtitle">
            Stay Safe <span>•</span> Stay Smart <span>•</span> Stay Secure
        </p>

        <div class="welcome-menu">

            <a href="create-account.html">
                <button>
                    <span class="button-icon">👤</span>
                    <span>Create Account</span>
                    <span class="arrow">›</span>
                </button>
            </a>

            <a href="login.html">
                <button>
                    <span class="button-icon">🔐</span>
                    <span>Already Have Account</span>
                    <span class="arrow">›</span>
                </button>
            </a>

        </div>

    </div>

    <style>
    .welcome-menu {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 25px;
    }

    .welcome-menu a {
        width: 100%;
        max-width: 320px;
        text-decoration: none;
    }

    .welcome-menu button {
        width: 100%;
        min-height: 55px;
        padding: 12px 18px;
        border: 1px solid rgba(34, 197, 94, 0.45);
        border-radius: 14px;
        background: linear-gradient(
            135deg,
            #39ff14,
            #00e676
        );
        color: black;
        font-size: 15px;
        font-weight: 600;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.22);
        transition: 0.25s ease;
    }

    .welcome-menu button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 26px rgba(34, 197, 94, 0.25);
    }

    .welcome-menu .button-icon {
        margin-right: 8px;
    }

    .welcome-menu .arrow {
        margin-left: auto;
    }
</style>

</body>

</html>
