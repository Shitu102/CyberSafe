<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - CyberSafe</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .create-account-form {
            width: 100%;
            max-width: 360px;
            margin: 30px auto 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        .create-account-form label {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
        }

        .create-account-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid rgba(72,184,255,.3);
            border-radius: 20px;
            background: rgba(10, 25, 35, 0.85);
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .create-account-form input:focus {
            border-color: rgba(72,184,255,.3);
            box-shadow: 0 0 10px rgb(46, 41, 119);
        }

        /* Password box */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 50px !important;
        }

        /* Stylish eye button */
        .eye-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);

    width: 34px !important;
    height: 34px !important;

    padding: 0 !important;
    margin: 0 !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    border: none !important;
    background: transparent !important;

    cursor: pointer;
    line-height: 1 !important;
    box-shadow: none !important;
}

.eye-btn:hover {
    transform: translateY(-50%) !important;
    margin: 0 !important;
    padding: 0 !important;
    box-shadow: none !important;
}

.eye-btn:focus {
    outline: none;
    transform: translateY(-50%) !important;
}

        .eye-icon {
    position: relative;
    width: 20px;
    height: 13px;
    border: 2px solid #ffffff;
    border-radius: 50% / 65%;
    display: block;
    box-sizing: border-box;
}

.eye-icon::before {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    background: #ffffff;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.eye-icon.eye-off::after {
    content: "";
    position: absolute;
    width: 25px;
    height: 2px;
    background: #ffffff;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-35deg);
    border-radius: 2px;
}

        /* Create Account button */
        .create-account-button {
    width: 150px;
    height: 28px;

    margin-top: 20px;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 8px;
    padding: 0;

    border: none;
    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #39ff14,
        #00e676
    );

    color: #000000;

    font-size: 15px;
    font-weight: 700;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    text-align: center !important;

    white-space: nowrap;
    cursor: pointer;

    box-shadow: 0 7px 20px rgba(57, 255, 20, 0.22);

    transition: 0.25s ease;
}

        .create-account-button:hover {
    transform: translateY(-2px) !important;

    background: linear-gradient(
        135deg,
        #39ff14,
        #00e676
    ) !important;

    color: #000000 !important;

    box-shadow: 0 10px 25px rgba(57, 255, 20, 0.3) !important;
}

        /* Error message */
        .password-error {
            color: #ff5555;
            font-size: 13px;
            text-align: center;
            margin: 5px 0;
        }

        /* Login link */
        .login-link {
            margin-top: 22px;
            text-align: center;
            line-height: normal;
        }

        .login-link a {
            color: #39ff14;
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .success-message {
    display: none;

    width: 100%;
    box-sizing: border-box;

    margin-top: 8px;
    margin-bottom: 2px;

    padding: 10px 14px;

    border: 1px solid #39ff14;
    border-radius: 8px;

    background: #102518;

    color: #39ff14;

    font-size: 13px;
    font-weight: 600;

    text-align: center;

    line-height: 18px;

    box-shadow: none;

    animation: successFade 0.25s ease;
}

@keyframes successFade {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}

@keyframes successFade {
    from {
        opacity: 0;
        transform: translateY(-5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.signup-card {
    display: block !important;
    width: 92% !important;
    max-width: 450px !important;
    margin: 25px auto !important;
    padding: 25px 20px !important;
    box-sizing: border-box !important;

    border: 2px solid rgba(72,184,255,.3) !important;
    border-radius: 18px !important;

    background: rgba(0,20,50,.35) !important;

    box-shadow: 0 0 20px rgba(57, 255, 20, 0.20) !important;
}
    </style>

</head>

<body>

    <div class="signup-card">

    <!-- CyberSafe Header -->

<div class="signup-header">

    <h2>
        <img src="Logo.jpeg" alt="CyberSafe Logo">
        CyberSafe
    </h2>

    <p>
    To protect from scam messages, phishing images and fraudulent calls
</p>

</div>

<!-- Cyber Safety Image -->

<div class="signup-image">

    <img src="Safety.jpeg" alt="Cyber Safety">

</div>

<p class="signup-description">
    Sign up to protect yourself from online fraud,
    detect scam message, emails and calls
</p>

        <!-- Create Account Form -->

        <div class="create-account-form">

            <!-- Username -->

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
            >


            <!-- Create Password -->

            <label for="password">
                Create Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword('password', this)"
                    aria-label="Show or hide password"
                >

                    <span class="eye-icon eye-off"></span>

                </button>

            </div>


            <!-- Confirm Password -->

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword('confirmPassword', this)"
                    aria-label="Show or hide password"
                >

                    <span class="eye-icon eye-off"></span>

                </button>

            </div>


            <!-- Error -->

            <p
                id="passwordError"
                class="password-error"
            ></p>

            <div id="successMessage"
            class="success-message"></div>


            <!-- Create Account -->

            <button
                type="button"
                class="create-account-button"
                onclick="createAccount()"
            >
                SIGN UP
            </button>

            <p class="login-link">
    Already have an account? <a href="login.html">Login</a>
</p>

        </div>

    <script>

        function togglePassword(inputId, eyeButton) {

    const input = document.getElementById(inputId);
    const eyeIcon = eyeButton.querySelector(".eye-icon");

    if (input.type === "password") {

        input.type = "text";

        // Password visible → line remove
        eyeIcon.classList.remove("eye-off");

    } else {

        input.type = "password";

        // Password hidden → line show
        eyeIcon.classList.add("eye-off");
    }
}


        /* =========================
           CREATE ACCOUNT
        ========================= */

        function createAccount() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const error =
                document.getElementById("passwordError");


            error.innerHTML = "";


            /* Username */

            if (username === "") {

                error.innerHTML =
                    "⚠️ Please enter username.";

                return;

            }


            /* Password length */

            if (password.length < 8) {

                error.innerHTML =
                    "⚠️ Please enter a different password. Password must contain at least 8 characters.";

                return;

            }


            /* Alphabet */

            if (!/[A-Za-z]/.test(password)) {

                error.innerHTML =
                    "⚠️ Password must contain at least one alphabet.";

                return;

            }


            /* Number */

            if (!/[0-9]/.test(password)) {

                error.innerHTML =
                    "⚠️ Password must contain at least one number.";

                return;

            }


            /* Special character */

            if (!/[^A-Za-z0-9]/.test(password)) {

                error.innerHTML =
                    "⚠️ Password must contain at least one special sign.";

                return;

            }


            /* Confirm password */

            if (password !== confirmPassword) {

                error.innerHTML =
                    "⚠️ Passwords do not match.";

                return;

            }


            /* Get existing accounts */

            let accounts =
                JSON.parse(
                    localStorage.getItem("cyberSafeAccounts")
                ) || [];


            /* Check duplicate username */

            let existingAccount =
                accounts.find(
                    account =>
                        account.username === username
                );


            if (existingAccount) {

                error.innerHTML =
                    "⚠️ Username already exists. Please choose a different username.";

                return;

            }


            /* Add new account */

            accounts.push({

                username: username,

                password: password

            });


            /* Save all accounts */

localStorage.setItem(
    "cyberSafeAccounts",
    JSON.stringify(accounts)
);


/* Set login session */

sessionStorage.setItem("cyberSafeLogin", "true");
sessionStorage.setItem("cyberSafeUsername", username);
sessionStorage.removeItem("cyberSafeWelcomeShown");


/* Go to Home */

window.location.href = "index.html";

        }

    </script>

</body>

</html>
